name: CI

on:
  push:
  pull_request:

jobs:
  # Fast tests: generator, validation, window maths, streaming scenarios, city data, API (local Spark, no Docker)
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit + integration tests
        env:
          TZ: UTC
        run: pytest tests/unit tests/integration -v

  # Full pipeline in Docker (Kafka, Spark, PostGIS, Airflow, Grafana, dashboard), then end-to-end tests
  end-to-end:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create .env from the example (random CI-only passwords)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^AIRFLOW_ADMIN_PASSWORD=.*/AIRFLOW_ADMIN_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^AIRFLOW_SECRET_KEY=.*/AIRFLOW_SECRET_KEY=$(openssl rand -hex 24)/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^BACKFILL_HOURS=.*/BACKFILL_HOURS=1/" .env   # 1 hour of history is enough for the tests
      - name: Start the stack
        run: docker compose up -d --build
      - name: Install test dependencies
        run: pip install pytest==8.3.3 confluent-kafka==2.6.1 psycopg2-binary==2.9.10
      - name: Run end-to-end tests
        run: pytest tests/e2e -v -m "not slow"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
